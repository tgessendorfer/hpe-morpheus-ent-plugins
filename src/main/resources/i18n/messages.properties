# OpenRouter plugin - English defaults. Non-ASCII characters are written as \uXXXX escapes.
openrouter.serviceUrl.label=API Endpoint
openrouter.serviceUrl.help=OpenRouter's OpenAI-compatible API, https://openrouter.ai/api/v1. For in-region routing, a Business plan feature, use https://eu.openrouter.ai/api/v1 or https://us.openrouter.ai/api/v1; only models available in that region are then listed. The plugin appends /chat/completions, /models and /key, and adds /api/v1 or /v1 when the URL stops short of it.
openrouter.credential.label=Credentials
openrouter.servicePassword.label=API Key
openrouter.useNetworkProxy.label=Route Outbound Calls Through a Proxy
openrouter.useNetworkProxy.help=Off means a direct connection. This checkbox exists because the integration form gives no way to clear a chosen proxy: Morpheus 9.0.1 renders the dropdown below with no empty entry, so unticking this is how you go back to connecting directly.
openrouter.networkProxy.label=Network Proxy
openrouter.networkProxy.help=The proxy to use, from Infrastructure > Networks > Proxies. Only applied when the box above is ticked. The appliance makes the call, so this is the proxy that needs to reach openrouter.ai - each integration picks its own, independently of the proxy any cloud uses.
openrouter.maxOutputTokens.label=Default Max Output Tokens
openrouter.maxOutputTokens.help=Sent as max_tokens when the caller does not supply a limit. Leave empty to let each model use its own maximum. Reasoning tokens count against this limit, so a low value can cut off the answers of reasoning models.
openrouter.reasoningEffort.label=Reasoning Effort
openrouter.reasoningEffort.help=Model default sends nothing and leaves reasoning to each model. Low, Medium or High is sent as reasoning.effort on every request. More effort is slower and uses more output tokens. Reasoning is never shown in the chat.
openrouter.includeAnthropicModels.label=List Anthropic Models
openrouter.includeAnthropicModels.help=Off by default. Claude models are better served by the Anthropic Claude plugin, which caches the MCP tool catalog through OpenRouter's Anthropic-compatible API. This integration sets no cache breakpoints, so the catalog is billed as fresh input on every tool round.
openrouter.includeFreeModels.label=List Free Variants
openrouter.includeFreeModels.help=Off by default. The :free variants cost nothing, but they have their own rate limits and availability, and one agent question with tool rounds is many requests.
openrouter.modelAllowList.label=Only List These Models
openrouter.modelAllowList.help=Optional comma-separated model ids, with * as a wildcard, for example: openai/gpt-5*, google/gemini-3*, mistralai/*. Only matching models are listed, which keeps the model tab and the agent form short. Leave empty to list every model that supports tool calling. The two checkboxes above still apply. A model that drops out of the list is removed when the list is refreshed, which saving does, unless an agent still uses it.
openrouter.usageFooter.label=Append Cost to Answers
openrouter.usageFooter.help=Adds an italic line to the end of each final answer with what the whole question cost, summed over all of its requests as OpenRouter reports them. Morpheus shows no usage anywhere in the chat. Tool-call turns are left untouched, and the line is removed before an answer is replayed as history.
