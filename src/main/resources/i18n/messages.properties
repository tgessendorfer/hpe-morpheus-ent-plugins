# Anthropic Claude plugin - English defaults. Non-ASCII characters are written as \uXXXX escapes.
anthropic-claude.serviceUrl.label=API Endpoint
anthropic-claude.serviceUrl.help=https://api.anthropic.com, or an Anthropic-compatible gateway such as https://openrouter.ai/api. Through OpenRouter only the Anthropic Claude models are listed.
anthropic-claude.credential.label=Credentials
anthropic-claude.servicePassword.label=API Key
anthropic-claude.useNetworkProxy.label=Route Outbound Calls Through a Proxy
anthropic-claude.useNetworkProxy.help=Off means a direct connection. This checkbox exists because the integration form gives no way to clear a chosen proxy: Morpheus 9.0.1 renders the dropdown below with no empty entry, so unticking this is how you go back to connecting directly.
anthropic-claude.networkProxy.label=Network Proxy
anthropic-claude.networkProxy.help=The proxy to use, from Infrastructure > Networks > Proxies. Only applied when the box above is ticked. The appliance makes the call, so this is the proxy that needs to reach api.anthropic.com - each integration picks its own, independently of the proxy any cloud uses.
anthropic-claude.apiVersion.label=Anthropic API Version
anthropic-claude.apiVersion.help=Value sent in the anthropic-version header. Leave at the default unless Anthropic tells you otherwise.
anthropic-claude.maxOutputTokens.label=Default Max Output Tokens
anthropic-claude.maxOutputTokens.help=The Messages API requires max_tokens on every request. Used when the caller does not supply one.
anthropic-claude.promptCaching.label=Enable Prompt Caching
anthropic-claude.promptCaching.help=Marks the system prompt and tool definitions as cacheable. Strongly recommended for MCP-backed Agents, where the same large tool catalog is resent on every turn.
anthropic-claude.thinkingEnabled.label=Enable Extended Thinking
anthropic-claude.thinkingEnabled.help=Lets the model reason before answering. Slower and more expensive; temperature and top_p are ignored while enabled.
anthropic-claude.thinkingBudgetTokens.label=Thinking Budget (tokens)
anthropic-claude.thinkingBudgetTokens.help=Minimum 1024. Must stay below Max Output Tokens - the provider raises max_tokens automatically if needed.
anthropic-claude.longContext.label=Enable 1M Token Context (beta)
anthropic-claude.longContext.help=Sends the context-1m beta header. Only supported on Sonnet 4.5 and newer, and priced at a premium above 200k input tokens.
anthropic-claude.samplingParams.label=Send temperature and top_p
anthropic-claude.samplingParams.help=Off by default. Newer Claude models reject temperature with "400 `temperature` is deprecated for this model", and Morpheus supplies one on every chat request. Only enable this against models that still accept sampling parameters.
anthropic-claude.usageFooter.label=Append token usage to answers
anthropic-claude.usageFooter.help=Adds an italic line with cached, input and output token counts to the end of each final answer. Morpheus does not display token usage anywhere in the chat, so this is the only way to see the prompt cache working without reading the appliance log. Intermediate tool-call turns are left untouched. Through OpenRouter, which reports what each request cost, the line shows the cost of the whole question instead, summed over all of its requests.
anthropic-claude.webSearch.label=Enable Web Search and Fetch
anthropic-claude.webSearch.help=Adds the server-side web_search and web_fetch tools from Anthropic. Anthropic runs both on its own infrastructure inside the same API call, so the appliance needs no extra egress and the agent needs no additional MCP server. Web search is billed at $10 per 1,000 searches on top of tokens; web fetch costs only the tokens of the page it reads. Answers gain a Sources list.
anthropic-claude.webSearchCodeFiltering.label=Filter Search Results with Code Execution
anthropic-claude.webSearchCodeFiltering.help=Off by default. On Claude 4.6 and newer, lets Claude filter search results by running code before they reach the context window, which saves tokens on search-heavy research. The catch for MCP-backed agents: once code execution is available the model also uses it to process tool results, so a tool round costs an extra inference round and a fresh sandbox container - measured even on questions that never searched the web. Leave it off for agents that use MCP tools.
anthropic-claude.webSearchMaxUses.label=Max Web Searches per Request
anthropic-claude.webSearchMaxUses.help=Hard cap on searches and fetches for a single request, applied to both tools. Simple questions use one to three searches. This is the only ceiling on what a looping agent can spend on search.
anthropic-claude.webSearchAllowedDomains.label=Restrict to Domains
anthropic-claude.webSearchAllowedDomains.help=Optional comma-separated allow list, for example: docs.morpheusdata.com, community.hpe.com, support.hpe.com. Bare hostnames with an optional path and no scheme. Leave empty to search the whole web. Narrowing this is the strongest control against a fetched page trying to talk the agent into something.
