# Anthropic Claude plugin - Romanian. Non-ASCII characters are written as \uXXXX escapes.
anthropic-claude.serviceUrl.label=Endpoint API
anthropic-claude.serviceUrl.help=https://api.anthropic.com sau un gateway compatibil cu Anthropic, de exemplu https://openrouter.ai/api. Prin OpenRouter sunt listate doar modelele Anthropic Claude.
anthropic-claude.credential.label=Creden\u021biale
anthropic-claude.servicePassword.label=Cheie API
anthropic-claude.useNetworkProxy.label=Direc\u021bioneaz\u0103 apelurile de ie\u0219ire printr-un proxy
anthropic-claude.useNetworkProxy.help=Dezactivat \u00eenseamn\u0103 conexiune direct\u0103. Aceast\u0103 caset\u0103 exist\u0103 deoarece formularul nu permite \u0219tergerea unui proxy ales: Morpheus 9.0.1 afi\u0219eaz\u0103 lista de mai jos f\u0103r\u0103 o intrare goal\u0103. Debifarea ei readuce conexiunea direct\u0103.
anthropic-claude.networkProxy.label=Proxy de re\u021bea
anthropic-claude.networkProxy.help=Proxy-ul folosit, din Infrastructure > Networks > Proxies. Se aplic\u0103 doar c\u00e2nd caseta de mai sus este bifat\u0103. Apelul este f\u0103cut de appliance, deci acest proxy trebuie s\u0103 ajung\u0103 la api.anthropic.com. Fiecare integrare \u00ee\u0219i alege propriul proxy, independent de proxy-ul oric\u0103rui cloud.
anthropic-claude.apiVersion.label=Versiune API Anthropic
anthropic-claude.apiVersion.help=Valoarea trimis\u0103 \u00een antetul anthropic-version. L\u0103sa\u021bi valoarea implicit\u0103, dac\u0103 Anthropic nu indic\u0103 altfel.
anthropic-claude.maxOutputTokens.label=Num\u0103r maxim implicit de tokeni de ie\u0219ire
anthropic-claude.maxOutputTokens.help=Messages API cere max_tokens la fiecare cerere. Se folose\u0219te atunci c\u00e2nd apelantul nu specific\u0103 o valoare.
anthropic-claude.promptCaching.label=Activeaz\u0103 cache-ul pentru prompturi
anthropic-claude.promptCaching.help=Marcheaz\u0103 promptul de sistem \u0219i defini\u021biile instrumentelor ca put\u00e2nd fi puse \u00een cache. Recomandat insistent pentru agen\u021bii cu servere MCP, unde acela\u0219i catalog mare de instrumente este retrimis la fiecare tur\u0103.
anthropic-claude.thinkingEnabled.label=Activeaz\u0103 g\u00e2ndirea extins\u0103
anthropic-claude.thinkingEnabled.help=Permite modelului s\u0103 ra\u021bioneze \u00eenainte de a r\u0103spunde. Mai lent \u0219i mai scump; temperature \u0219i top_p sunt ignorate c\u00e2t timp este activ.
anthropic-claude.thinkingBudgetTokens.label=Buget de g\u00e2ndire (tokeni)
anthropic-claude.thinkingBudgetTokens.help=Minim 1024. Trebuie s\u0103 r\u0103m\u00e2n\u0103 sub num\u0103rul maxim de tokeni de ie\u0219ire - providerul m\u0103re\u0219te automat max_tokens dac\u0103 este nevoie.
anthropic-claude.longContext.label=Activeaz\u0103 contextul de 1M tokeni (beta)
anthropic-claude.longContext.help=Trimite antetul beta context-1m. Suportat doar de la Sonnet 4.5; peste 200.000 de tokeni de intrare se aplic\u0103 un pre\u021b mai mare.
anthropic-claude.samplingParams.label=Trimite temperature \u0219i top_p
anthropic-claude.samplingParams.help=Dezactivat implicit. Modelele Claude mai noi resping temperature cu "400 `temperature` is deprecated for this model", iar Morpheus trimite o valoare la fiecare cerere de chat. Activa\u021bi doar pentru modelele care \u00eenc\u0103 accept\u0103 parametri de e\u0219antionare.
anthropic-claude.usageFooter.label=Adaug\u0103 consumul de tokeni la r\u0103spunsuri
anthropic-claude.usageFooter.help=Adaug\u0103 la finalul fiec\u0103rui r\u0103spuns final o linie cursiv\u0103 cu num\u0103rul de tokeni din cache, de intrare \u0219i de ie\u0219ire. Morpheus nu afi\u0219eaz\u0103 nic\u0103ieri \u00een chat consumul de tokeni, a\u0219a c\u0103 doar astfel se poate vedea cache-ul func\u021bion\u00e2nd f\u0103r\u0103 a citi jurnalul appliance-ului. Turele intermediare cu apeluri de instrumente r\u0103m\u00e2n neschimbate. Prin OpenRouter, care raporteaz\u0103 costul fiec\u0103rei cereri, linia arat\u0103 \u00een schimb costul \u00eentregii \u00eentreb\u0103ri, \u00eensumat pe toate cererile ei.
anthropic-claude.webSearch.label=Activeaz\u0103 c\u0103utarea \u0219i preluarea web
anthropic-claude.webSearch.help=Adaug\u0103 instrumentele de server web_search \u0219i web_fetch de la Anthropic. Anthropic le ruleaz\u0103 pe ambele pe propria infrastructur\u0103, \u00een acela\u0219i apel API, astfel c\u0103 appliance-ul nu are nevoie de acces suplimentar la internet, iar agentul de un server MCP suplimentar. C\u0103utarea web cost\u0103 10 USD la 1.000 de c\u0103ut\u0103ri, pe l\u00e2ng\u0103 tokeni; preluarea unei pagini cost\u0103 doar tokenii paginii citite. R\u0103spunsurile primesc o list\u0103 de surse.
anthropic-claude.webSearchCodeFiltering.label=Filtreaz\u0103 rezultatele c\u0103ut\u0103rii prin execu\u021bie de cod
anthropic-claude.webSearchCodeFiltering.help=Dezactivat implicit. De la Claude 4.6, Claude filtreaz\u0103 rezultatele c\u0103ut\u0103rii rul\u00e2nd cod \u00eenainte ca acestea s\u0103 ajung\u0103 \u00een context, ceea ce economise\u0219te tokeni la cercet\u0103ri intensive. Capcana pentru agen\u021bii cu instrumente MCP: odat\u0103 ce execu\u021bia de cod este disponibil\u0103, modelul o folose\u0219te \u0219i pentru a procesa rezultatele instrumentelor, a\u0219a c\u0103 o tur\u0103 de instrumente cost\u0103 o rund\u0103 suplimentar\u0103 de inferen\u021b\u0103 \u0219i un container sandbox nou - m\u0103surat chiar \u0219i la \u00eentreb\u0103ri care nu au c\u0103utat deloc pe web. Pentru agen\u021bii cu instrumente MCP, l\u0103sa\u021bi dezactivat.
anthropic-claude.webSearchMaxUses.label=Num\u0103r maxim de c\u0103ut\u0103ri web per cerere
anthropic-claude.webSearchMaxUses.help=Limit\u0103 maxim\u0103 pentru c\u0103ut\u0103ri \u0219i prelu\u0103ri de pagini \u00eentr-o singur\u0103 cerere, aplicat\u0103 ambelor instrumente. \u00centreb\u0103rile simple folosesc una p\u00e2n\u0103 la trei c\u0103ut\u0103ri. Este singura limit\u0103 pentru c\u00e2t poate cheltui pe c\u0103ut\u0103ri un agent intrat \u00een bucl\u0103.
anthropic-claude.webSearchAllowedDomains.label=Restric\u021bioneaz\u0103 la domenii
anthropic-claude.webSearchAllowedDomains.help=List\u0103 op\u021bional\u0103 de domenii permise, separate prin virgul\u0103, de exemplu: docs.morpheusdata.com, community.hpe.com, support.hpe.com. Doar nume de gazd\u0103, op\u021bional cu cale, f\u0103r\u0103 schem\u0103. L\u0103sa\u021bi gol pentru a c\u0103uta pe tot webul. Restr\u00e2ngerea listei este cea mai puternic\u0103 protec\u021bie \u00eempotriva unei pagini preluate care \u00eencearc\u0103 s\u0103 conving\u0103 agentul s\u0103 fac\u0103 ceva.
