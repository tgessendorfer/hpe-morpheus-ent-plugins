# OpenRouter plugin - German. Non-ASCII characters are written as \uXXXX escapes.
openrouter.serviceUrl.label=API-Endpunkt
openrouter.serviceUrl.help=Die OpenAI-kompatible API von OpenRouter, https://openrouter.ai/api/v1. Das Plugin h\u00e4ngt /chat/completions, /models und /key an. Eine URL, die auf /api endet (die Basis-URL der Anthropic-kompatiblen API von OpenRouter), bekommt /v1 angeh\u00e4ngt.
openrouter.credential.label=Anmeldedaten
openrouter.servicePassword.label=API-Schl\u00fcssel
openrouter.useNetworkProxy.label=Ausgehende Aufrufe \u00fcber einen Proxy leiten
openrouter.useNetworkProxy.help=Aus bedeutet eine direkte Verbindung. Die Checkbox gibt es, weil sich ein gew\u00e4hlter Proxy im Formular nicht wieder entfernen l\u00e4sst: Morpheus 9.0.1 zeigt die Auswahl darunter ohne leeren Eintrag. Wer die Checkbox abw\u00e4hlt, verbindet sich wieder direkt.
openrouter.networkProxy.label=Netzwerk-Proxy
openrouter.networkProxy.help=Der zu verwendende Proxy aus Infrastruktur > Netzwerke > Proxys. Gilt nur, wenn die Checkbox dar\u00fcber aktiv ist. Die Verbindung baut die Appliance auf, dieser Proxy muss also openrouter.ai erreichen. Jede Integration w\u00e4hlt ihren eigenen, unabh\u00e4ngig vom Proxy einer Cloud.
openrouter.maxOutputTokens.label=Standardwert f\u00fcr maximale Ausgabe-Tokens
openrouter.maxOutputTokens.help=Wird als max_tokens gesendet, wenn der Aufrufer kein Limit mitgibt. Leer lassen, damit jedes Modell sein eigenes Maximum nutzt. Reasoning-Tokens z\u00e4hlen mit, ein niedriger Wert kann also die Antworten von Reasoning-Modellen abschneiden.
openrouter.reasoningEffort.label=Reasoning-Aufwand
openrouter.reasoningEffort.help=Model default sendet nichts und \u00fcberl\u00e4sst das Reasoning dem Modell. Low, Medium oder High geht bei jeder Anfrage als reasoning.effort mit. Mehr Aufwand ist langsamer und verbraucht mehr Ausgabe-Tokens. Das Reasoning erscheint nie im Chat.
openrouter.includeAnthropicModels.label=Anthropic-Modelle auflisten
openrouter.includeAnthropicModels.help=Standardm\u00e4\u00dfig aus. Claude-Modelle laufen besser \u00fcber das Plugin Anthropic Claude, das den MCP-Tool-Katalog \u00fcber die Anthropic-kompatible API von OpenRouter cacht. Diese Integration setzt keine Cache-Breakpoints, der Katalog wird hier in jeder Tool-Runde als neuer Input berechnet.
openrouter.includeFreeModels.label=Kostenlose Varianten auflisten
openrouter.includeFreeModels.help=Standardm\u00e4\u00dfig aus. Die :free-Varianten kosten nichts, haben aber eigene Rate-Limits und eine eigene Verf\u00fcgbarkeit, und eine Agent-Frage mit Tool-Runden besteht aus vielen Anfragen.
openrouter.usageFooter.label=Kosten an Antworten anh\u00e4ngen
openrouter.usageFooter.help=H\u00e4ngt an jede fertige Antwort eine kursive Zeile mit den Kosten der ganzen Frage an, summiert \u00fcber alle ihre Anfragen, wie OpenRouter sie meldet. Morpheus zeigt den Verbrauch nirgends im Chat an. Zwischenschritte mit Tool-Aufrufen bleiben unver\u00e4ndert, und die Zeile wird entfernt, bevor die Antwort als Verlauf erneut gesendet wird.
