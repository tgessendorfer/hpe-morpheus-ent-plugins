# Anthropic Claude plugin - German. Non-ASCII characters are written as \uXXXX escapes.
anthropic-claude.serviceUrl.label=API-Endpunkt
anthropic-claude.serviceUrl.help=https://api.anthropic.com oder ein Anthropic-kompatibles Gateway wie https://openrouter.ai/api. \u00dcber OpenRouter werden nur die Anthropic-Claude-Modelle aufgelistet.
anthropic-claude.credential.label=Anmeldedaten
anthropic-claude.servicePassword.label=API-Schl\u00fcssel
anthropic-claude.useNetworkProxy.label=Ausgehende Aufrufe \u00fcber einen Proxy leiten
anthropic-claude.useNetworkProxy.help=Aus bedeutet eine direkte Verbindung. Die Checkbox gibt es, weil sich ein gew\u00e4hlter Proxy im Formular nicht wieder entfernen l\u00e4sst: Morpheus 9.0.1 zeigt die Auswahl darunter ohne leeren Eintrag. Wer die Checkbox abw\u00e4hlt, verbindet sich wieder direkt.
anthropic-claude.networkProxy.label=Netzwerk-Proxy
anthropic-claude.networkProxy.help=Der zu verwendende Proxy aus Infrastruktur > Netzwerke > Proxys. Gilt nur, wenn die Checkbox dar\u00fcber aktiv ist. Die Verbindung baut die Appliance auf, dieser Proxy muss also api.anthropic.com erreichen. Jede Integration w\u00e4hlt ihren eigenen, unabh\u00e4ngig vom Proxy einer Cloud.
anthropic-claude.apiVersion.label=Anthropic-API-Version
anthropic-claude.apiVersion.help=Wert f\u00fcr den Header anthropic-version. Nur \u00e4ndern, wenn Anthropic dazu auffordert.
anthropic-claude.maxOutputTokens.label=Standardwert f\u00fcr maximale Ausgabe-Tokens
anthropic-claude.maxOutputTokens.help=Die Messages API verlangt max_tokens bei jeder Anfrage. Dieser Wert gilt, wenn der Aufrufer keinen mitgibt.
anthropic-claude.promptCaching.label=Prompt-Caching aktivieren
anthropic-claude.promptCaching.help=Markiert System-Prompt und Tool-Definitionen als cachebar. Dringend empfohlen f\u00fcr Agents mit MCP-Servern, bei denen derselbe gro\u00dfe Tool-Katalog in jeder Runde erneut gesendet wird.
anthropic-claude.thinkingEnabled.label=Erweitertes Denken aktivieren
anthropic-claude.thinkingEnabled.help=L\u00e4sst das Modell vor der Antwort nachdenken. Langsamer und teurer; temperature und top_p werden dabei ignoriert.
anthropic-claude.thinkingBudgetTokens.label=Denkbudget (Tokens)
anthropic-claude.thinkingBudgetTokens.help=Mindestens 1024. Muss unter den maximalen Ausgabe-Tokens bleiben - der Provider erh\u00f6ht max_tokens bei Bedarf automatisch.
anthropic-claude.longContext.label=Kontext mit 1 Mio. Tokens aktivieren (Beta)
anthropic-claude.longContext.help=Sendet den Beta-Header context-1m. Erst ab Sonnet 4.5 unterst\u00fctzt; oberhalb von 200.000 Input-Tokens gilt ein h\u00f6herer Preis.
anthropic-claude.samplingParams.label=temperature und top_p senden
anthropic-claude.samplingParams.help=Standardm\u00e4\u00dfig aus. Neuere Claude-Modelle lehnen temperature mit "400 `temperature` is deprecated for this model" ab, und Morpheus schickt bei jeder Chat-Anfrage einen Wert mit. Nur f\u00fcr Modelle aktivieren, die Sampling-Parameter noch akzeptieren.
anthropic-claude.usageFooter.label=Token-Verbrauch an Antworten anh\u00e4ngen
anthropic-claude.usageFooter.help=H\u00e4ngt an jede fertige Antwort eine kursive Zeile mit gecachten, Input- und Output-Tokens an. Morpheus zeigt den Token-Verbrauch nirgends im Chat an; nur so l\u00e4sst sich das Prompt-Caching ohne Blick ins Appliance-Log beobachten. Zwischenschritte mit Tool-Aufrufen bleiben unver\u00e4ndert. \u00dcber OpenRouter, das die Kosten jeder Anfrage meldet, zeigt die Zeile stattdessen die Kosten der ganzen Frage, summiert \u00fcber alle ihre Anfragen.
anthropic-claude.webSearch.label=Websuche und Seitenabruf aktivieren
anthropic-claude.webSearch.help=F\u00fcgt die serverseitigen Tools web_search und web_fetch von Anthropic hinzu. Anthropic f\u00fchrt beide auf eigener Infrastruktur im selben API-Aufruf aus; die Appliance braucht keinen zus\u00e4tzlichen Internetzugang und der Agent keinen weiteren MCP-Server. Websuchen kosten 10 $ pro 1.000 Suchen zus\u00e4tzlich zu den Tokens; ein Seitenabruf kostet nur die Tokens der gelesenen Seite. Antworten erhalten eine Quellenliste.
anthropic-claude.webSearchCodeFiltering.label=Suchergebnisse per Codeausf\u00fchrung filtern
anthropic-claude.webSearchCodeFiltering.help=Standardm\u00e4\u00dfig aus. Ab Claude 4.6 filtert Claude Suchergebnisse per Codeausf\u00fchrung, bevor sie in den Kontext gelangen; das spart Tokens bei rechercheintensiven Aufgaben. Der Haken bei Agents mit MCP-Tools: Sobald Codeausf\u00fchrung verf\u00fcgbar ist, verarbeitet das Modell damit auch Tool-Ergebnisse. Eine Tool-Runde kostet dann eine zus\u00e4tzliche Inferenzrunde und einen neuen Sandbox-Container - gemessen sogar bei Fragen ohne Websuche. F\u00fcr Agents mit MCP-Tools ausgeschaltet lassen.
anthropic-claude.webSearchMaxUses.label=Maximale Websuchen pro Anfrage
anthropic-claude.webSearchMaxUses.help=Obergrenze f\u00fcr Suchen und Seitenabrufe pro Anfrage, gilt f\u00fcr beide Tools. Einfache Fragen brauchen ein bis drei Suchen. Das ist die einzige Grenze daf\u00fcr, was ein Agent in einer Schleife f\u00fcr Suchen ausgeben kann.
anthropic-claude.webSearchAllowedDomains.label=Auf Domains beschr\u00e4nken
anthropic-claude.webSearchAllowedDomains.help=Optionale, kommagetrennte Liste erlaubter Domains, zum Beispiel: docs.morpheusdata.com, community.hpe.com, support.hpe.com. Nur Hostnamen, optional mit Pfad, ohne Schema. Leer lassen, um im ganzen Web zu suchen. Eine enge Liste ist der wirksamste Schutz gegen eine abgerufene Seite, die den Agent zu etwas \u00fcberreden will.
