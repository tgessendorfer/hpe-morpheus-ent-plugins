# Anthropic Claude plugin - Polish. Non-ASCII characters are written as \uXXXX escapes.
anthropic-claude.serviceUrl.label=Punkt ko\u0144cowy API
anthropic-claude.serviceUrl.help=https://api.anthropic.com lub brama zgodna z Anthropic, np. https://openrouter.ai/api. Przez OpenRouter wy\u015bwietlane s\u0105 tylko modele Anthropic Claude.
anthropic-claude.credential.label=Po\u015bwiadczenia
anthropic-claude.servicePassword.label=Klucz API
anthropic-claude.useNetworkProxy.label=Kieruj po\u0142\u0105czenia wychodz\u0105ce przez proxy
anthropic-claude.useNetworkProxy.help=Wy\u0142\u0105czone oznacza po\u0142\u0105czenie bezpo\u015brednie. To pole istnieje, poniewa\u017c formularz nie pozwala usun\u0105\u0107 wybranego proxy: Morpheus 9.0.1 wy\u015bwietla list\u0119 poni\u017cej bez pustej pozycji. Odznaczenie tego pola przywraca po\u0142\u0105czenie bezpo\u015brednie.
anthropic-claude.networkProxy.label=Proxy sieciowe
anthropic-claude.networkProxy.help=Proxy z Infrastruktura > Networks > Proxies. U\u017cywane tylko, gdy pole powy\u017cej jest zaznaczone. Po\u0142\u0105czenie nawi\u0105zuje appliance, wi\u0119c to proxy musi mie\u0107 dost\u0119p do api.anthropic.com. Ka\u017cda integracja wybiera w\u0142asne proxy, niezale\u017cnie od proxy chmury.
anthropic-claude.apiVersion.label=Wersja API Anthropic
anthropic-claude.apiVersion.help=Warto\u015b\u0107 nag\u0142\u00f3wka anthropic-version. Zmieniaj tylko, je\u015bli Anthropic tego wymaga.
anthropic-claude.maxOutputTokens.label=Domy\u015blna maksymalna liczba token\u00f3w wyj\u015bciowych
anthropic-claude.maxOutputTokens.help=Messages API wymaga max_tokens w ka\u017cdym zapytaniu. Ta warto\u015b\u0107 jest u\u017cywana, gdy wywo\u0142uj\u0105cy jej nie poda.
anthropic-claude.promptCaching.label=W\u0142\u0105cz buforowanie prompt\u00f3w
anthropic-claude.promptCaching.help=Oznacza prompt systemowy i definicje narz\u0119dzi jako mo\u017cliwe do buforowania. Zdecydowanie zalecane dla agent\u00f3w z serwerami MCP, gdzie ten sam du\u017cy katalog narz\u0119dzi jest wysy\u0142any w ka\u017cdej turze.
anthropic-claude.thinkingEnabled.label=W\u0142\u0105cz rozszerzone my\u015blenie
anthropic-claude.thinkingEnabled.help=Pozwala modelowi przemy\u015ble\u0107 odpowied\u017a. Wolniej i dro\u017cej; temperature i top_p s\u0105 wtedy ignorowane.
anthropic-claude.thinkingBudgetTokens.label=Bud\u017cet my\u015blenia (tokeny)
anthropic-claude.thinkingBudgetTokens.help=Minimum 1024. Musi by\u0107 mniejszy ni\u017c maksymalna liczba token\u00f3w wyj\u015bciowych - w razie potrzeby provider automatycznie zwi\u0119ksza max_tokens.
anthropic-claude.longContext.label=W\u0142\u0105cz kontekst 1M token\u00f3w (beta)
anthropic-claude.longContext.help=Wysy\u0142a nag\u0142\u00f3wek beta context-1m. Obs\u0142ugiwane dopiero od Sonnet 4.5; powy\u017cej 200 000 token\u00f3w wej\u015bciowych obowi\u0105zuje wy\u017csza cena.
anthropic-claude.samplingParams.label=Wysy\u0142aj temperature i top_p
anthropic-claude.samplingParams.help=Domy\u015blnie wy\u0142\u0105czone. Nowsze modele Claude odrzucaj\u0105 temperature b\u0142\u0119dem "400 `temperature` is deprecated for this model", a Morpheus wysy\u0142a t\u0119 warto\u015b\u0107 w ka\u017cdym zapytaniu czatu. W\u0142\u0105czaj tylko dla modeli, kt\u00f3re nadal akceptuj\u0105 parametry pr\u00f3bkowania.
anthropic-claude.usageFooter.label=Do\u0142\u0105czaj zu\u017cycie token\u00f3w do odpowiedzi
anthropic-claude.usageFooter.help=Dodaje na ko\u0144cu ka\u017cdej ko\u0144cowej odpowiedzi lini\u0119 kursyw\u0105 z liczb\u0105 token\u00f3w z bufora, wej\u015bciowych i wyj\u015bciowych. Morpheus nigdzie w czacie nie pokazuje zu\u017cycia token\u00f3w, wi\u0119c to jedyny spos\u00f3b, by zobaczy\u0107 dzia\u0142anie buforowania bez przegl\u0105dania logu appliance. Po\u015brednie tury z wywo\u0142aniami narz\u0119dzi pozostaj\u0105 bez zmian. Przez OpenRouter, kt\u00f3ry podaje koszt ka\u017cdego zapytania, linia pokazuje zamiast tego koszt ca\u0142ego pytania, zsumowany ze wszystkich jego zapyta\u0144.
anthropic-claude.webSearch.label=W\u0142\u0105cz wyszukiwanie i pobieranie stron
anthropic-claude.webSearch.help=Dodaje serwerowe narz\u0119dzia web_search i web_fetch firmy Anthropic. Anthropic uruchamia oba na w\u0142asnej infrastrukturze w ramach tego samego wywo\u0142ania API, wi\u0119c appliance nie potrzebuje dodatkowego dost\u0119pu do internetu, a agent dodatkowego serwera MCP. Wyszukiwanie kosztuje 10 USD za 1000 wyszukiwa\u0144 plus tokeny; pobranie strony kosztuje tylko tokeny odczytanej strony. Odpowiedzi zawieraj\u0105 list\u0119 \u017ar\u00f3de\u0142.
anthropic-claude.webSearchCodeFiltering.label=Filtruj wyniki wyszukiwania za pomoc\u0105 wykonywania kodu
anthropic-claude.webSearchCodeFiltering.help=Domy\u015blnie wy\u0142\u0105czone. Od Claude 4.6 Claude filtruje wyniki wyszukiwania, uruchamiaj\u0105c kod, zanim trafi\u0105 do kontekstu, co oszcz\u0119dza tokeny przy intensywnym wyszukiwaniu. Haczyk dla agent\u00f3w z narz\u0119dziami MCP: gdy wykonywanie kodu jest dost\u0119pne, model u\u017cywa go te\u017c do przetwarzania wynik\u00f3w narz\u0119dzi, wi\u0119c runda narz\u0119dzi kosztuje dodatkow\u0105 rund\u0119 wnioskowania i nowy kontener sandbox - zmierzone nawet przy pytaniach bez wyszukiwania w sieci. Dla agent\u00f3w z narz\u0119dziami MCP pozostaw wy\u0142\u0105czone.
anthropic-claude.webSearchMaxUses.label=Maks. liczba wyszukiwa\u0144 na zapytanie
anthropic-claude.webSearchMaxUses.help=G\u00f3rny limit wyszukiwa\u0144 i pobra\u0144 stron na jedno zapytanie, dotyczy obu narz\u0119dzi. Proste pytania wymagaj\u0105 od jednego do trzech wyszukiwa\u0144. To jedyny limit tego, ile zap\u0119tlony agent mo\u017ce wyda\u0107 na wyszukiwanie.
anthropic-claude.webSearchAllowedDomains.label=Ogranicz do domen
anthropic-claude.webSearchAllowedDomains.help=Opcjonalna lista dozwolonych domen oddzielonych przecinkami, np.: docs.morpheusdata.com, community.hpe.com, support.hpe.com. Same nazwy host\u00f3w, opcjonalnie ze \u015bcie\u017ck\u0105, bez schematu. Pozostaw puste, aby wyszukiwa\u0107 w ca\u0142ej sieci. Zaw\u0119\u017cenie listy to najsilniejsza ochrona przed pobran\u0105 stron\u0105, kt\u00f3ra pr\u00f3buje nak\u0142oni\u0107 agenta do czego\u015b.
