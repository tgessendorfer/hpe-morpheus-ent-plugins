# OpenRouter plugin - Polish. Non-ASCII characters are written as \uXXXX escapes.
openrouter.serviceUrl.label=Punkt ko\u0144cowy API
openrouter.serviceUrl.help=API OpenRoutera zgodne z OpenAI, https://openrouter.ai/api/v1. Do routingu w regionie, funkcji planu Business, u\u017cyj https://eu.openrouter.ai/api/v1 lub https://us.openrouter.ai/api/v1; wtedy wy\u015bwietlane s\u0105 tylko modele dost\u0119pne w tym regionie. Plugin do\u0142\u0105cza /chat/completions, /models i /key oraz uzupe\u0142nia /api/v1 lub /v1, je\u015bli adres URL ko\u0144czy si\u0119 wcze\u015bniej.
openrouter.credential.label=Po\u015bwiadczenia
openrouter.servicePassword.label=Klucz API
openrouter.useNetworkProxy.label=Kieruj po\u0142\u0105czenia wychodz\u0105ce przez proxy
openrouter.useNetworkProxy.help=Wy\u0142\u0105czone oznacza po\u0142\u0105czenie bezpo\u015brednie. To pole istnieje, poniewa\u017c formularz nie pozwala usun\u0105\u0107 wybranego proxy: Morpheus 9.0.1 wy\u015bwietla list\u0119 poni\u017cej bez pustej pozycji. Odznaczenie tego pola przywraca po\u0142\u0105czenie bezpo\u015brednie.
openrouter.networkProxy.label=Proxy sieciowe
openrouter.networkProxy.help=Proxy z Infrastruktura > Networks > Proxies. U\u017cywane tylko, gdy pole powy\u017cej jest zaznaczone. Po\u0142\u0105czenie nawi\u0105zuje appliance, wi\u0119c to proxy musi mie\u0107 dost\u0119p do openrouter.ai. Ka\u017cda integracja wybiera w\u0142asne proxy, niezale\u017cnie od proxy chmury.
openrouter.maxOutputTokens.label=Domy\u015blna maksymalna liczba token\u00f3w wyj\u015bciowych
openrouter.maxOutputTokens.help=Wysy\u0142ana jako max_tokens, gdy wywo\u0142uj\u0105cy nie poda limitu. Pozostaw puste, aby ka\u017cdy model u\u017cywa\u0142 w\u0142asnego maksimum. Tokeny rozumowania wliczaj\u0105 si\u0119 do limitu, wi\u0119c niska warto\u015b\u0107 mo\u017ce ucina\u0107 odpowiedzi modeli rozumuj\u0105cych.
openrouter.reasoningEffort.label=Poziom rozumowania
openrouter.reasoningEffort.help=Model default niczego nie wysy\u0142a i pozostawia rozumowanie modelowi. Low, Medium lub High jest wysy\u0142ane w ka\u017cdym zapytaniu jako reasoning.effort. Wy\u017cszy poziom dzia\u0142a wolniej i zu\u017cywa wi\u0119cej token\u00f3w wyj\u015bciowych. Rozumowanie nigdy nie jest pokazywane w czacie.
openrouter.includeAnthropicModels.label=Wy\u015bwietlaj modele Anthropic
openrouter.includeAnthropicModels.help=Domy\u015blnie wy\u0142\u0105czone. Modele Claude lepiej dzia\u0142aj\u0105 przez plugin Anthropic Claude, kt\u00f3ry buforuje katalog narz\u0119dzi MCP przez API OpenRoutera zgodne z Anthropic. Ta integracja nie ustawia punkt\u00f3w buforowania, wi\u0119c katalog jest tu liczony jako nowe dane wej\u015bciowe w ka\u017cdej rundzie narz\u0119dzi.
openrouter.includeFreeModels.label=Wy\u015bwietlaj darmowe warianty
openrouter.includeFreeModels.help=Domy\u015blnie wy\u0142\u0105czone. Warianty :free nic nie kosztuj\u0105, ale maj\u0105 w\u0142asne limity zapyta\u0144 i w\u0142asn\u0105 dost\u0119pno\u015b\u0107, a jedno pytanie agenta z rundami narz\u0119dzi to wiele zapyta\u0144.
openrouter.modelAllowList.label=Wy\u015bwietlaj tylko te modele
openrouter.modelAllowList.help=Identyfikatory modeli oddzielone przecinkami, * jako symbol wieloznaczny, np. openai/gpt-5*, google/gemini-3*. Sam * wy\u015bwietla wszystkie modele obs\u0142uguj\u0105ce narz\u0119dzia; u\u017cywaj go zamiast pustego pola, kt\u00f3rego Morpheus 9.0.1 nie zapisuje. Pola wyboru powy\u017cej nadal obowi\u0105zuj\u0105. Model, kt\u00f3ry wypada z listy, jest usuwany przy zapisie, chyba \u017ce agent go u\u017cywa.
openrouter.usageFooter.label=Do\u0142\u0105czaj koszt do odpowiedzi
openrouter.usageFooter.help=Dodaje na ko\u0144cu ka\u017cdej ko\u0144cowej odpowiedzi lini\u0119 kursyw\u0105 z kosztem ca\u0142ego pytania, zsumowanym ze wszystkich jego zapyta\u0144 wed\u0142ug OpenRoutera. Morpheus nigdzie w czacie nie pokazuje zu\u017cycia. Tury z wywo\u0142aniami narz\u0119dzi pozostaj\u0105 bez zmian, a linia jest usuwana, zanim odpowied\u017a zostanie ponownie wys\u0142ana jako historia.
