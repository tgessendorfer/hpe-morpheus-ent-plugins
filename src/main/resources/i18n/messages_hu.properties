# Anthropic Claude plugin - Hungarian. Non-ASCII characters are written as \uXXXX escapes.
anthropic-claude.serviceUrl.label=API-v\u00e9gpont
anthropic-claude.serviceUrl.help=https://api.anthropic.com vagy egy Anthropic-kompatibilis \u00e1tj\u00e1r\u00f3, p\u00e9ld\u00e1ul https://openrouter.ai/api. OpenRouteren kereszt\u00fcl csak az Anthropic Claude modellek jelennek meg.
anthropic-claude.credential.label=Hiteles\u00edt\u0151 adatok
anthropic-claude.servicePassword.label=API-kulcs
anthropic-claude.useNetworkProxy.label=Kimen\u0151 h\u00edv\u00e1sok proxyn kereszt\u00fcl
anthropic-claude.useNetworkProxy.help=Kikapcsolva k\u00f6zvetlen kapcsolatot jelent. Ez a jel\u00f6l\u0151n\u00e9gyzet az\u00e9rt l\u00e9tezik, mert az \u0171rlapon a kiv\u00e1lasztott proxy nem t\u00f6r\u00f6lhet\u0151: a Morpheus 9.0.1 az alatta l\u00e9v\u0151 list\u00e1t \u00fcres elem n\u00e9lk\u00fcl jelen\u00edti meg. A jel\u00f6l\u00e9s t\u00f6rl\u00e9s\u00e9vel t\u00e9rhet vissza a k\u00f6zvetlen kapcsolathoz.
anthropic-claude.networkProxy.label=H\u00e1l\u00f3zati proxy
anthropic-claude.networkProxy.help=A haszn\u00e1land\u00f3 proxy az Infrastructure > Networks > Proxies men\u00fcb\u0151l. Csak akkor \u00e9rv\u00e9nyes, ha a fenti n\u00e9gyzet be van jel\u00f6lve. A h\u00edv\u00e1st az appliance ind\u00edtja, ez\u00e9rt ennek a proxynak kell el\u00e9rnie az api.anthropic.com c\u00edmet. Minden integr\u00e1ci\u00f3 saj\u00e1t proxyt v\u00e1laszt, a felh\u0151k proxyj\u00e1t\u00f3l f\u00fcggetlen\u00fcl.
anthropic-claude.apiVersion.label=Anthropic API-verzi\u00f3
anthropic-claude.apiVersion.help=Az anthropic-version fejl\u00e9cben k\u00fcld\u00f6tt \u00e9rt\u00e9k. Csak akkor m\u00f3dos\u00edtsa, ha az Anthropic ezt k\u00e9ri.
anthropic-claude.maxOutputTokens.label=Alap\u00e9rtelmezett maxim\u00e1lis kimeneti tokensz\u00e1m
anthropic-claude.maxOutputTokens.help=A Messages API minden k\u00e9r\u00e9sn\u00e9l megk\u00f6veteli a max_tokens \u00e9rt\u00e9ket. Ez az \u00e9rt\u00e9k akkor \u00e9rv\u00e9nyes, ha a h\u00edv\u00f3 nem ad meg saj\u00e1tot.
anthropic-claude.promptCaching.label=Promptgyors\u00edt\u00f3t\u00e1r enged\u00e9lyez\u00e9se
anthropic-claude.promptCaching.help=Gyors\u00edt\u00f3t\u00e1razhat\u00f3nak jel\u00f6li a rendszerpromptot \u00e9s az eszk\u00f6zdefin\u00edci\u00f3kat. Er\u0151sen aj\u00e1nlott MCP-szervereket haszn\u00e1l\u00f3 agentekhez, ahol ugyanaz a nagy eszk\u00f6zkatal\u00f3gus minden k\u00f6rben \u00fajra elk\u00fcld\u00e9sre ker\u00fcl.
anthropic-claude.thinkingEnabled.label=Kiterjesztett gondolkod\u00e1s enged\u00e9lyez\u00e9se
anthropic-claude.thinkingEnabled.help=Hagyja, hogy a modell v\u00e1lasz el\u0151tt gondolkodjon. Lassabb \u00e9s dr\u00e1g\u00e1bb; a temperature \u00e9s a top_p ilyenkor figyelmen k\u00edv\u00fcl marad.
anthropic-claude.thinkingBudgetTokens.label=Gondolkod\u00e1si keret (token)
anthropic-claude.thinkingBudgetTokens.help=Legal\u00e1bb 1024. A maxim\u00e1lis kimeneti tokensz\u00e1m alatt kell maradnia - a provider sz\u00fcks\u00e9g eset\u00e9n automatikusan megemeli a max_tokens \u00e9rt\u00e9ket.
anthropic-claude.longContext.label=1M tokenes kontextus enged\u00e9lyez\u00e9se (b\u00e9ta)
anthropic-claude.longContext.help=Elk\u00fcldi a context-1m b\u00e9ta fejl\u00e9cet. Csak Sonnet 4.5-t\u0151l t\u00e1mogatott; 200 000 bemeneti token felett magasabb \u00e1r \u00e9rv\u00e9nyes.
anthropic-claude.samplingParams.label=temperature \u00e9s top_p k\u00fcld\u00e9se
anthropic-claude.samplingParams.help=Alap\u00e9rtelmez\u00e9s szerint kikapcsolva. Az \u00fajabb Claude modellek a temperature \u00e9rt\u00e9ket "400 `temperature` is deprecated for this model" hib\u00e1val elutas\u00edtj\u00e1k, a Morpheus pedig minden cseveg\u00e9si k\u00e9r\u00e9sn\u00e9l k\u00fcld egyet. Csak olyan modellekn\u00e9l kapcsolja be, amelyek m\u00e9g elfogadj\u00e1k a mintav\u00e9teli param\u00e9tereket.
anthropic-claude.usageFooter.label=Tokenfelhaszn\u00e1l\u00e1s hozz\u00e1f\u0171z\u00e9se a v\u00e1laszokhoz
anthropic-claude.usageFooter.help=Minden v\u00e9gs\u0151 v\u00e1lasz v\u00e9g\u00e9re d\u0151lt bet\u0171s sort f\u0171z a gyors\u00edt\u00f3t\u00e1rb\u00f3l olvasott, a bemeneti \u00e9s a kimeneti tokenek sz\u00e1m\u00e1val. A Morpheus a cseveg\u00e9sben sehol nem mutatja a tokenfelhaszn\u00e1l\u00e1st, \u00edgy csak ezzel l\u00e1that\u00f3 a gyors\u00edt\u00f3t\u00e1r m\u0171k\u00f6d\u00e9se az appliance napl\u00f3j\u00e1nak olvas\u00e1sa n\u00e9lk\u00fcl. Az eszk\u00f6zh\u00edv\u00e1st tartalmaz\u00f3 k\u00f6ztes l\u00e9p\u00e9sek v\u00e1ltozatlanok maradnak. OpenRouteren kereszt\u00fcl, amely minden k\u00e9r\u00e9s k\u00f6lts\u00e9g\u00e9t jelenti, a sor ehelyett a teljes k\u00e9rd\u00e9s k\u00f6lts\u00e9g\u00e9t mutatja, az \u00f6sszes k\u00e9r\u00e9s\u00e9re \u00f6sszegezve.
anthropic-claude.webSearch.label=Webes keres\u00e9s \u00e9s oldallet\u00f6lt\u00e9s enged\u00e9lyez\u00e9se
anthropic-claude.webSearch.help=Hozz\u00e1adja az Anthropic szerveroldali web_search \u00e9s web_fetch eszk\u00f6zeit. Az Anthropic mindkett\u0151t a saj\u00e1t infrastrukt\u00far\u00e1j\u00e1n futtatja ugyanabban az API-h\u00edv\u00e1sban, \u00edgy az appliance-nek nincs sz\u00fcks\u00e9ge tov\u00e1bbi internet-hozz\u00e1f\u00e9r\u00e9sre, az agentnek pedig tov\u00e1bbi MCP-szerverre. A webes keres\u00e9s 1000 keres\u00e9senk\u00e9nt 10 USD a tokeneken fel\u00fcl; az oldallet\u00f6lt\u00e9s csak a beolvasott oldal tokenjeibe ker\u00fcl. A v\u00e1laszok forr\u00e1slist\u00e1t kapnak.
anthropic-claude.webSearchCodeFiltering.label=Keres\u00e9si tal\u00e1latok sz\u0171r\u00e9se k\u00f3dfuttat\u00e1ssal
anthropic-claude.webSearchCodeFiltering.help=Alap\u00e9rtelmez\u00e9s szerint kikapcsolva. Claude 4.6-t\u00f3l a Claude k\u00f3dfuttat\u00e1ssal sz\u0171ri a keres\u00e9si tal\u00e1latokat, miel\u0151tt a kontextusba ker\u00fclnek, ami keres\u00e9ssel terhelt feladatokn\u00e1l tokeneket takar\u00edt meg. A h\u00e1tul\u00fct\u0151 MCP-eszk\u00f6z\u00f6ket haszn\u00e1l\u00f3 agentekn\u00e9l: ha a k\u00f3dfuttat\u00e1s el\u00e9rhet\u0151, a modell az eszk\u00f6z\u00f6k eredm\u00e9nyeinek feldolgoz\u00e1s\u00e1ra is haszn\u00e1lja, \u00edgy egy eszk\u00f6zk\u00f6r egy tov\u00e1bbi k\u00f6vetkeztet\u00e9si k\u00f6rbe \u00e9s egy \u00faj sandbox-kont\u00e9nerbe ker\u00fcl - ezt olyan k\u00e9rd\u00e9sekn\u00e9l is m\u00e9rt\u00fck, amelyek egy\u00e1ltal\u00e1n nem kerestek a weben. MCP-eszk\u00f6z\u00f6ket haszn\u00e1l\u00f3 agentekn\u00e9l hagyja kikapcsolva.
anthropic-claude.webSearchMaxUses.label=Webes keres\u00e9sek max. sz\u00e1ma k\u00e9r\u00e9senk\u00e9nt
anthropic-claude.webSearchMaxUses.help=A keres\u00e9sek \u00e9s oldallet\u00f6lt\u00e9sek fels\u0151 korl\u00e1tja egy k\u00e9r\u00e9sen bel\u00fcl, mindk\u00e9t eszk\u00f6zre vonatkozik. Egyszer\u0171 k\u00e9rd\u00e9sekhez egy-h\u00e1rom keres\u00e9s el\u00e9g. Ez az egyetlen korl\u00e1t arra, mennyit k\u00f6lthet keres\u00e9sre egy ciklusba ker\u00fclt agent.
anthropic-claude.webSearchAllowedDomains.label=Korl\u00e1toz\u00e1s domainekre
anthropic-claude.webSearchAllowedDomains.help=Opcion\u00e1lis, vessz\u0151vel elv\u00e1lasztott enged\u00e9lyez\u00e9si lista, p\u00e9ld\u00e1ul: docs.morpheusdata.com, community.hpe.com, support.hpe.com. Csak hosztnevek, opcion\u00e1lisan el\u00e9r\u00e9si \u00fattal, s\u00e9ma n\u00e9lk\u00fcl. Hagyja \u00fcresen a teljes webben val\u00f3 keres\u00e9shez. A lista sz\u0171k\u00edt\u00e9se a leger\u0151sebb v\u00e9delem egy olyan let\u00f6lt\u00f6tt oldal ellen, amely r\u00e1 akarja venni az agentet valamire.
