# Anthropic Claude plugin - Czech. Non-ASCII characters are written as \uXXXX escapes.
anthropic-claude.serviceUrl.label=Koncov\u00fd bod API
anthropic-claude.serviceUrl.help=https://api.anthropic.com nebo br\u00e1na kompatibiln\u00ed s Anthropic, nap\u0159\u00edklad https://openrouter.ai/api. P\u0159es OpenRouter se zobrazuj\u00ed jen modely Anthropic Claude.
anthropic-claude.credential.label=P\u0159ihla\u0161ovac\u00ed \u00fadaje
anthropic-claude.servicePassword.label=Kl\u00ed\u010d API
anthropic-claude.useNetworkProxy.label=Sm\u011brovat odchoz\u00ed vol\u00e1n\u00ed p\u0159es proxy
anthropic-claude.useNetworkProxy.help=Vypnuto znamen\u00e1 p\u0159\u00edm\u00e9 p\u0159ipojen\u00ed. Toto pole existuje, proto\u017ee ve formul\u00e1\u0159i nelze vybranou proxy odebrat: Morpheus 9.0.1 zobrazuje seznam n\u00ed\u017ee bez pr\u00e1zdn\u00e9 polo\u017eky. Zru\u0161en\u00edm za\u0161krtnut\u00ed se vr\u00e1t\u00edte k p\u0159\u00edm\u00e9mu p\u0159ipojen\u00ed.
anthropic-claude.networkProxy.label=S\u00ed\u0165ov\u00e1 proxy
anthropic-claude.networkProxy.help=Proxy z Infrastructure > Networks > Proxies. Pou\u017eije se jen, kdy\u017e je pole v\u00fd\u0161e za\u0161krtnut\u00e9. P\u0159ipojen\u00ed navazuje appliance, tak\u017ee tato proxy mus\u00ed dos\u00e1hnout na api.anthropic.com. Ka\u017ed\u00e1 integrace si vol\u00ed vlastn\u00ed proxy, nez\u00e1visle na proxy cloudu.
anthropic-claude.apiVersion.label=Verze Anthropic API
anthropic-claude.apiVersion.help=Hodnota hlavi\u010dky anthropic-version. M\u011b\u0148te ji jen na pokyn Anthropic.
anthropic-claude.maxOutputTokens.label=V\u00fdchoz\u00ed maximum v\u00fdstupn\u00edch token\u016f
anthropic-claude.maxOutputTokens.help=Messages API vy\u017eaduje max_tokens u ka\u017ed\u00e9ho po\u017eadavku. Tato hodnota se pou\u017eije, kdy\u017e ji volaj\u00edc\u00ed neuvede.
anthropic-claude.promptCaching.label=Povolit ukl\u00e1d\u00e1n\u00ed prompt\u016f do mezipam\u011bti
anthropic-claude.promptCaching.help=Ozna\u010d\u00ed syst\u00e9mov\u00fd prompt a definice n\u00e1stroj\u016f jako cachovateln\u00e9. D\u016frazn\u011b doporu\u010deno pro agenty se servery MCP, kde se stejn\u00fd velk\u00fd katalog n\u00e1stroj\u016f pos\u00edl\u00e1 v ka\u017ed\u00e9m kole.
anthropic-claude.thinkingEnabled.label=Povolit roz\u0161\u00ed\u0159en\u00e9 p\u0159em\u00fd\u0161len\u00ed
anthropic-claude.thinkingEnabled.help=Nech\u00e1 model p\u0159ed odpov\u011bd\u00ed p\u0159em\u00fd\u0161let. Pomalej\u0161\u00ed a dra\u017e\u0161\u00ed; temperature a top_p se p\u0159itom ignoruj\u00ed.
anthropic-claude.thinkingBudgetTokens.label=Rozpo\u010det na p\u0159em\u00fd\u0161len\u00ed (tokeny)
anthropic-claude.thinkingBudgetTokens.help=Minim\u00e1ln\u011b 1024. Mus\u00ed z\u016fstat pod maximem v\u00fdstupn\u00edch token\u016f - provider v p\u0159\u00edpad\u011b pot\u0159eby automaticky zv\u00fd\u0161\u00ed max_tokens.
anthropic-claude.longContext.label=Povolit kontext 1M token\u016f (beta)
anthropic-claude.longContext.help=Odes\u00edl\u00e1 beta hlavi\u010dku context-1m. Podporov\u00e1no a\u017e od Sonnet 4.5; nad 200 000 vstupn\u00edch token\u016f plat\u00ed vy\u0161\u0161\u00ed cena.
anthropic-claude.samplingParams.label=Odes\u00edlat temperature a top_p
anthropic-claude.samplingParams.help=Ve v\u00fdchoz\u00edm stavu vypnuto. Nov\u011bj\u0161\u00ed modely Claude odm\u00edtaj\u00ed temperature chybou "400 `temperature` is deprecated for this model" a Morpheus ji pos\u00edl\u00e1 u ka\u017ed\u00e9ho po\u017eadavku chatu. Zap\u00ednejte jen pro modely, kter\u00e9 parametry vzorkov\u00e1n\u00ed st\u00e1le p\u0159ij\u00edmaj\u00ed.
anthropic-claude.usageFooter.label=P\u0159ipojit spot\u0159ebu token\u016f k odpov\u011bd\u00edm
anthropic-claude.usageFooter.help=Na konec ka\u017ed\u00e9 fin\u00e1ln\u00ed odpov\u011bdi p\u0159id\u00e1 kurz\u00edvou \u0159\u00e1dek s po\u010dty token\u016f z mezipam\u011bti, vstupn\u00edch a v\u00fdstupn\u00edch. Morpheus spot\u0159ebu token\u016f v chatu nikde nezobrazuje, tak\u017ee jen tak lze sledovat mezipam\u011b\u0165 bez \u010dten\u00ed logu appliance. Mezikroky s vol\u00e1n\u00edm n\u00e1stroj\u016f z\u016fst\u00e1vaj\u00ed beze zm\u011bny. P\u0159es OpenRouter, kter\u00fd hl\u00e1s\u00ed cenu ka\u017ed\u00e9ho po\u017eadavku, \u0159\u00e1dek m\u00edsto toho ukazuje cenu cel\u00e9 ot\u00e1zky, se\u010dtenou p\u0159es v\u0161echny jej\u00ed po\u017eadavky.
anthropic-claude.webSearch.label=Povolit vyhled\u00e1v\u00e1n\u00ed a na\u010d\u00edt\u00e1n\u00ed webu
anthropic-claude.webSearch.help=P\u0159id\u00e1 serverov\u00e9 n\u00e1stroje web_search a web_fetch od Anthropic. Anthropic oba spou\u0161t\u00ed na vlastn\u00ed infrastruktu\u0159e v r\u00e1mci stejn\u00e9ho vol\u00e1n\u00ed API, tak\u017ee appliance nepot\u0159ebuje dal\u0161\u00ed p\u0159\u00edstup do internetu a agent dal\u0161\u00ed server MCP. Vyhled\u00e1v\u00e1n\u00ed stoj\u00ed 10 USD za 1 000 hled\u00e1n\u00ed nav\u00edc k token\u016fm; na\u010dten\u00ed str\u00e1nky stoj\u00ed jen tokeny na\u010dten\u00e9 str\u00e1nky. Odpov\u011bdi obsahuj\u00ed seznam zdroj\u016f.
anthropic-claude.webSearchCodeFiltering.label=Filtrovat v\u00fdsledky hled\u00e1n\u00ed spou\u0161t\u011bn\u00edm k\u00f3du
anthropic-claude.webSearchCodeFiltering.help=Ve v\u00fdchoz\u00edm stavu vypnuto. Od Claude 4.6 Claude filtruje v\u00fdsledky hled\u00e1n\u00ed spu\u0161t\u011bn\u00edm k\u00f3du d\u0159\u00edve, ne\u017e se dostanou do kontextu, co\u017e \u0161et\u0159\u00ed tokeny p\u0159i n\u00e1ro\u010dn\u00e9m vyhled\u00e1v\u00e1n\u00ed. H\u00e1\u010dek pro agenty s n\u00e1stroji MCP: jakmile je spou\u0161t\u011bn\u00ed k\u00f3du k dispozici, model ho pou\u017e\u00edv\u00e1 i ke zpracov\u00e1n\u00ed v\u00fdsledk\u016f n\u00e1stroj\u016f, tak\u017ee kolo n\u00e1stroj\u016f stoj\u00ed dal\u0161\u00ed kolo inference a nov\u00fd kontejner sandboxu - nam\u011b\u0159eno i u ot\u00e1zek bez hled\u00e1n\u00ed na webu. Pro agenty s n\u00e1stroji MCP ponechte vypnut\u00e9.
anthropic-claude.webSearchMaxUses.label=Max. po\u010det vyhled\u00e1v\u00e1n\u00ed na po\u017eadavek
anthropic-claude.webSearchMaxUses.help=Horn\u00ed limit hled\u00e1n\u00ed a na\u010dten\u00ed str\u00e1nek na jeden po\u017eadavek, plat\u00ed pro oba n\u00e1stroje. Jednoduch\u00e9 ot\u00e1zky pot\u0159ebuj\u00ed jedno a\u017e t\u0159i hled\u00e1n\u00ed. Je to jedin\u00fd strop toho, kolik m\u016f\u017ee zacyklen\u00fd agent za hled\u00e1n\u00ed utratit.
anthropic-claude.webSearchAllowedDomains.label=Omezit na dom\u00e9ny
anthropic-claude.webSearchAllowedDomains.help=Voliteln\u00fd seznam povolen\u00fdch dom\u00e9n odd\u011blen\u00fdch \u010d\u00e1rkou, nap\u0159\u00edklad: docs.morpheusdata.com, community.hpe.com, support.hpe.com. Jen n\u00e1zvy hostitel\u016f, voliteln\u011b s cestou, bez sch\u00e9matu. Nechte pr\u00e1zdn\u00e9 pro hled\u00e1n\u00ed v cel\u00e9m webu. Z\u00fa\u017een\u00ed seznamu je nejsiln\u011bj\u0161\u00ed ochrana proti na\u010dten\u00e9 str\u00e1nce, kter\u00e1 se sna\u017e\u00ed agenta k n\u011b\u010demu p\u0159emluvit.
