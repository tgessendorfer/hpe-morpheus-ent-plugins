import asset.pipeline.AssetPipelineConfigHolder
import asset.pipeline.AssetSpecLoader
import asset.pipeline.gradle.AssetCompile

buildscript {
	repositories {
		mavenCentral()
		maven { url = "https://plugins.gradle.org/m2/" }
		maven { url = "https://nexus.bertramlabs.com/content/repositories/snapshots" }
		maven { url = "https://nexus.bertramlabs.com/content/repositories/releases" }
		maven { url = "https://nexus.bertramlabs.com/content/repositories/publicReleases" }
	}
	dependencies {
		classpath "com.gradleup.shadow:shadow-gradle-plugin:9.6.1"
		classpath "com.bertramlabs.plugins:asset-pipeline-gradle:$assetPipelineVersion"
		classpath "com.morpheusdata:morpheus-plugin-gradle:$morpheusPluginApiVersion"
	}
}

apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'idea'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.morpheusdata.morpheus-plugin-gradle'

group = 'com.morpheusdata.openrouter'
java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}
ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

repositories {
	mavenCentral()
	maven { url = "https://nexus.bertramlabs.com/content/repositories/snapshots" }
	maven { url = "https://nexus.bertramlabs.com/content/repositories/releases" }
	maven { url = "https://nexus.bertramlabs.com/content/repositories/publicReleases" }
}

configurations {
	provided
}

dependencies {
	provided "com.morpheusdata:morpheus-plugin-api:$morpheusPluginApiVersion"
	provided "org.codehaus.groovy:groovy-all:$groovyVersion"

	implementation "org.slf4j:slf4j-api:$slf4jVersion"
	implementation 'org.apache.httpcomponents:httpclient:4.5.13'
	implementation 'org.apache.httpcomponents:httpcore:4.4.5'

	testImplementation "com.morpheusdata:morpheus-plugin-api:$morpheusPluginApiVersion"
	testImplementation 'io.reactivex.rxjava3:rxjava:3.1.8'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
	testImplementation "org.codehaus.groovy:groovy-all:$groovyVersion"
	testImplementation 'net.bytebuddy:byte-buddy:1.14.11'
	testImplementation 'org.objenesis:objenesis:3.3'
	testImplementation "org.spockframework:spock-core:$spockVersion"
}

sourceSets {
	main {
		compileClasspath += configurations.provided
	}
}

jar {
	manifest {
		attributes(
			'Plugin-Class': 'com.morpheusdata.openrouter.OpenRouterPlugin',
			'Plugin-Version': version,
			'Morpheus-Name': 'OpenRouter',
			'Morpheus-Organization': 'community',
			'Morpheus-Code': 'openrouter-llm-plugin',
			'Morpheus-Description': 'LLM integration for OpenRouter over its OpenAI-compatible API - models from every vendor OpenRouter serves, with MCP tool use',
			'Morpheus-Logo': 'assets/router-mark.svg',
			'Morpheus-Logo-Dark': 'assets/router-mark-white.svg',
			'Morpheus-Color': '#12A594',
			'Morpheus-Labels': 'Plugin, LLM, AI, OpenRouter',
			'Morpheus-Repo': 'https://github.com/tgessendorfer/hpe-morpheus-ent-plugins/tree/main/llm/openrouter',
			'Morpheus-Min-Appliance-Version': morpheusMinApplianceVersion
		)
	}
}

task copyRuntimeLibs(type: Copy) {
	into "lib"
	from project.configurations.runtimeClasspath - project.configurations.provided
}

test {
	useJUnitPlatform()
	testLogging {
		exceptionFormat = 'full'
		showStandardStreams = true
	}
}

shadowJar {
}

tasks.withType(Sign) {
	onlyIf { isReleaseVersion }
}

tasks.assemble.dependsOn tasks.shadowJar

// asset-pipeline 4.4.0's AssetCompile reads its classpath through Task.project while it runs, which
// Gradle 9 deprecates and Gradle 10 rejects. This subclass gets the classpath as a task input set at
// configuration time. The asset-pipeline plugin is not applied; the task is wired the way the plugin
// wires it: compiled assets go to build/assets and into jar and shadowJar under assets/.
@CacheableTask
abstract class PluginAssetCompile extends AssetCompile {
	@Classpath
	abstract ConfigurableFileCollection getAssetClasspath()

	@Inject
	abstract ObjectFactory getObjects()

	@Internal
	@Override
	FileCollection getClasspath() {
		assetClasspath
	}

	@Internal
	@Override
	FileTree getSource() {
		objects.fileTree().from(assetsDir)
	}

	@Override
	void loadAssetSpecifications() {
		AssetSpecLoader.loadSpecifications()
	}
}

AssetPipelineConfigHolder.config = (AssetPipelineConfigHolder.config ?: [:]) + [cacheLocation: layout.buildDirectory.file('.assetcache').get().asFile.path]

def assetCompile = tasks.register('assetCompile', PluginAssetCompile) {
	assetsDir = file('src/assets')
	destinationDir = layout.buildDirectory.dir('assets').get().asFile
	assetClasspath.from(configurations.runtimeClasspath, configurations.provided)
}

[tasks.named('jar'), tasks.named('shadowJar')].each { jarTask ->
	jarTask.configure {
		from(assetCompile) {
			into 'assets'
		}
	}
}
