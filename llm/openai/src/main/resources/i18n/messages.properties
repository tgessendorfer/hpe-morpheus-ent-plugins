# OpenAI-compatible API plugin - English defaults. Non-ASCII characters are written as \uXXXX escapes.
openai-llm.serviceUrl.label=API Endpoint
openai-llm.serviceUrl.help=Base URL of the OpenAI-compatible API, including its version path: https://api.openai.com/v1, https://openrouter.ai/api/v1, http://litellm.example.com:4000/v1. The plugin appends /models and /chat/completions and changes nothing else. HTTPS endpoints need a certificate the appliance trusts.
openai-llm.credential.label=Credentials
openai-llm.servicePassword.label=API Key
openai-llm.useNetworkProxy.label=Route Outbound Calls Through a Proxy
openai-llm.useNetworkProxy.help=Off means a direct connection. This checkbox exists because the integration form gives no way to clear a chosen proxy: Morpheus 9.0.1 renders the dropdown below with no empty entry, so unticking this is how you go back to connecting directly.
openai-llm.networkProxy.label=Network Proxy
openai-llm.networkProxy.help=The proxy to use, from Infrastructure > Networks > Proxies. Only applied when the box above is ticked. The appliance makes the call, so this is the proxy that needs to reach the API endpoint - each integration picks its own, independently of the proxy any cloud uses.
openai-llm.maxOutputTokens.label=Default Max Output Tokens
openai-llm.maxOutputTokens.help=Sent as max_tokens - max_completion_tokens for OpenAI reasoning models - when the caller does not supply a limit. Leave empty to let each model use its own maximum. Reasoning tokens count against this limit, so a low value can cut off the answers of reasoning models; an OpenAI reasoning model gets at least 8192 unless this field says otherwise. An answer the limit cuts off says so.
openai-llm.reasoningEffort.label=Reasoning Effort
openai-llm.reasoningEffort.help=Model default sends nothing and leaves reasoning to each model. Low, Medium or High is sent as reasoning_effort on every request; an API that does not know the parameter may reject it. More effort is slower and uses more output tokens. Reasoning is never shown in the chat.
openai-llm.modelAllowList.label=Only List These Models
openai-llm.modelAllowList.help=Comma-separated model ids, * as wildcard, e.g. gpt-5*, gpt-4.1-mini. * alone lists every chat model the endpoint serves; use it instead of an empty field, which Morpheus 9.0.1 does not save. A model that drops out is removed on save unless an agent uses it.
openai-llm.usageFooter.label=Append Usage to Answers
openai-llm.usageFooter.help=Adds an italic line to the end of each final answer with the tokens of the last request - or, when the API reports a cost per request as OpenRouter does, what the whole question cost over all of its requests. Morpheus shows no usage anywhere in the chat. Tool-call turns are left untouched, and the line is removed before an answer is replayed as history.
openai-llm.chatErrors.label=Show API Errors in Chat
openai-llm.chatErrors.help=On by default. When the API refuses a question - a wrong key, no credits left, a rate limit, a model that is down - the chat shows the API's message and what to do about it, instead of Morpheus' generic error. The message is left out when the conversation is replayed to the model. A rate limit or an overloaded provider is waited out twice before that.
openai-llm.dropEmptyToolArguments.label=Drop Empty Tool Arguments
openai-llm.dropEmptyToolArguments.help=On by default. Some models fill every optional parameter of a tool call with an empty string, 0 or false, and the built-in Morpheus tools treat those as filters: list_servers then finds no servers. With this on, such top-level arguments are removed before Morpheus runs the tool, which is the same as leaving them out. Untick it to forward tool calls exactly as the model wrote them.
