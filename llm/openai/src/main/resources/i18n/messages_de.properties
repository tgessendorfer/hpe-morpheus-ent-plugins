# OpenAI-compatible API plugin - German. Non-ASCII characters are written as \uXXXX escapes.
openai-llm.serviceUrl.label=API-Endpunkt
openai-llm.serviceUrl.help=Basis-URL der OpenAI-kompatiblen API einschlie\u00dflich Versionspfad: https://api.openai.com/v1, https://openrouter.ai/api/v1, http://litellm.example.com:4000/v1. Das Plugin h\u00e4ngt /models und /chat/completions an und \u00e4ndert sonst nichts. HTTPS-Endpunkte brauchen ein Zertifikat, dem die Appliance vertraut.
openai-llm.credential.label=Anmeldedaten
openai-llm.servicePassword.label=API-Schl\u00fcssel
openai-llm.useNetworkProxy.label=Ausgehende Aufrufe \u00fcber einen Proxy leiten
openai-llm.useNetworkProxy.help=Aus bedeutet eine direkte Verbindung. Die Checkbox gibt es, weil sich ein gew\u00e4hlter Proxy im Formular nicht wieder entfernen l\u00e4sst: Morpheus 9.0.1 zeigt die Auswahl darunter ohne leeren Eintrag. Wer die Checkbox abw\u00e4hlt, verbindet sich wieder direkt.
openai-llm.networkProxy.label=Netzwerk-Proxy
openai-llm.networkProxy.help=Der zu verwendende Proxy aus Infrastruktur > Netzwerke > Proxys. Gilt nur, wenn die Checkbox dar\u00fcber aktiv ist. Die Verbindung baut die Appliance auf, dieser Proxy muss also den API-Endpunkt erreichen. Jede Integration w\u00e4hlt ihren eigenen, unabh\u00e4ngig vom Proxy einer Cloud.
openai-llm.maxOutputTokens.label=Standardwert f\u00fcr maximale Ausgabe-Tokens
openai-llm.maxOutputTokens.help=Wird als max_tokens gesendet - bei OpenAI-Reasoning-Modellen als max_completion_tokens -, wenn der Aufrufer kein Limit mitgibt. Leer lassen, damit jedes Modell sein eigenes Maximum nutzt. Reasoning-Tokens z\u00e4hlen mit, ein niedriger Wert kann also die Antworten von Reasoning-Modellen abschneiden; ein OpenAI-Reasoning-Modell bekommt mindestens 8192, sofern dieses Feld nichts anderes sagt. Eine vom Limit abgeschnittene Antwort sagt das.
openai-llm.reasoningEffort.label=Reasoning-Aufwand
openai-llm.reasoningEffort.help=Model default sendet nichts und \u00fcberl\u00e4sst das Reasoning dem Modell. Low, Medium oder High geht bei jeder Anfrage als reasoning_effort mit; eine API, die den Parameter nicht kennt, kann ihn ablehnen. Mehr Aufwand ist langsamer und verbraucht mehr Ausgabe-Tokens. Das Reasoning erscheint nie im Chat.
openai-llm.modelAllowList.label=Nur diese Modelle auflisten
openai-llm.modelAllowList.help=Kommagetrennte Modell-IDs, * als Platzhalter, z. B. gpt-5*, gpt-4.1-mini. * allein listet alle Chat-Modelle des Endpunkts; statt eines leeren Felds verwenden, das Morpheus 9.0.1 nicht speichert. Ein Modell, das herausf\u00e4llt, wird beim Speichern entfernt, au\u00dfer ein Agent nutzt es.
openai-llm.usageFooter.label=Verbrauch an Antworten anh\u00e4ngen
openai-llm.usageFooter.help=H\u00e4ngt an jede fertige Antwort eine kursive Zeile mit den Tokens der letzten Anfrage an - oder, wenn die API wie OpenRouter je Anfrage Kosten meldet, mit den Kosten der ganzen Frage \u00fcber alle ihre Anfragen. Morpheus zeigt den Verbrauch nirgends im Chat an. Zwischenschritte mit Tool-Aufrufen bleiben unver\u00e4ndert, und die Zeile wird entfernt, bevor die Antwort als Verlauf erneut gesendet wird.
openai-llm.chatErrors.label=API-Fehler im Chat anzeigen
openai-llm.chatErrors.help=Standardm\u00e4\u00dfig an. Lehnt die API eine Frage ab - falscher Key, kein Guthaben, ein Rate-Limit, ein ausgefallenes Modell -, zeigt der Chat die Meldung der API und was zu tun ist, statt der allgemeinen Fehlermeldung von Morpheus. Die Meldung wird nicht an das Modell zur\u00fcckgespielt. Ein Rate-Limit oder ein \u00fcberlasteter Anbieter wird vorher zweimal abgewartet.
openai-llm.dropEmptyToolArguments.label=Leere Tool-Argumente entfernen
openai-llm.dropEmptyToolArguments.help=Standardm\u00e4\u00dfig an. Manche Modelle f\u00fcllen jeden optionalen Parameter eines Tool-Aufrufs mit einem leeren String, 0 oder false, und die eingebauten Morpheus-Tools werten das als Filter: list_servers findet dann keine Server. Mit dieser Option werden solche Argumente auf oberster Ebene entfernt, bevor Morpheus das Tool ausf\u00fchrt; das entspricht dem Weglassen. Abw\u00e4hlen, um Tool-Aufrufe genau so weiterzugeben, wie das Modell sie geschrieben hat.
