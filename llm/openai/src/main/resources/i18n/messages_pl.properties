# OpenAI-compatible API plugin - Polish. Non-ASCII characters are written as \uXXXX escapes.
openai-llm.serviceUrl.label=Punkt ko\u0144cowy API
openai-llm.serviceUrl.help=Bazowy adres URL API zgodnego z OpenAI wraz ze \u015bcie\u017ck\u0105 wersji: https://api.openai.com/v1, https://openrouter.ai/api/v1, http://litellm.example.com:4000/v1. Plugin do\u0142\u0105cza /models i /chat/completions i niczego wi\u0119cej nie zmienia. Punkty ko\u0144cowe HTTPS wymagaj\u0105 certyfikatu, kt\u00f3remu appliance ufa.
openai-llm.credential.label=Po\u015bwiadczenia
openai-llm.servicePassword.label=Klucz API
openai-llm.useNetworkProxy.label=Kieruj po\u0142\u0105czenia wychodz\u0105ce przez proxy
openai-llm.useNetworkProxy.help=Wy\u0142\u0105czone oznacza po\u0142\u0105czenie bezpo\u015brednie. To pole istnieje, poniewa\u017c formularz nie pozwala usun\u0105\u0107 wybranego proxy: Morpheus 9.0.1 wy\u015bwietla list\u0119 poni\u017cej bez pustej pozycji. Odznaczenie tego pola przywraca po\u0142\u0105czenie bezpo\u015brednie.
openai-llm.networkProxy.label=Proxy sieciowe
openai-llm.networkProxy.help=Proxy z Infrastruktura > Networks > Proxies. U\u017cywane tylko, gdy pole powy\u017cej jest zaznaczone. Po\u0142\u0105czenie nawi\u0105zuje appliance, wi\u0119c to proxy musi mie\u0107 dost\u0119p do punktu ko\u0144cowego API. Ka\u017cda integracja wybiera w\u0142asne proxy, niezale\u017cnie od proxy chmury.
openai-llm.maxOutputTokens.label=Domy\u015blna maksymalna liczba token\u00f3w wyj\u015bciowych
openai-llm.maxOutputTokens.help=Wysy\u0142ana jako max_tokens - dla modeli rozumuj\u0105cych OpenAI jako max_completion_tokens - gdy wywo\u0142uj\u0105cy nie poda limitu. Pozostaw puste, aby ka\u017cdy model u\u017cywa\u0142 w\u0142asnego maksimum. Tokeny rozumowania wliczaj\u0105 si\u0119 do limitu, wi\u0119c niska warto\u015b\u0107 mo\u017ce ucina\u0107 odpowiedzi modeli rozumuj\u0105cych; model rozumuj\u0105cy OpenAI dostaje co najmniej 8192, chyba \u017ce to pole stanowi inaczej. Odpowied\u017a uci\u0119ta przez limit informuje o tym.
openai-llm.reasoningEffort.label=Poziom rozumowania
openai-llm.reasoningEffort.help=Model default niczego nie wysy\u0142a i pozostawia rozumowanie modelowi. Low, Medium lub High jest wysy\u0142ane w ka\u017cdym zapytaniu jako reasoning_effort; API, kt\u00f3re nie zna tego parametru, mo\u017ce go odrzuci\u0107. Wy\u017cszy poziom dzia\u0142a wolniej i zu\u017cywa wi\u0119cej token\u00f3w wyj\u015bciowych. Rozumowanie nigdy nie jest pokazywane w czacie.
openai-llm.modelAllowList.label=Wy\u015bwietlaj tylko te modele
openai-llm.modelAllowList.help=Identyfikatory modeli oddzielone przecinkami, * jako symbol wieloznaczny, np. gpt-5*, gpt-4.1-mini. Sam * wy\u015bwietla wszystkie modele czatu z punktu ko\u0144cowego; u\u017cywaj go zamiast pustego pola, kt\u00f3rego Morpheus 9.0.1 nie zapisuje. Model, kt\u00f3ry wypada z listy, jest usuwany przy zapisie, chyba \u017ce agent go u\u017cywa.
openai-llm.usageFooter.label=Do\u0142\u0105czaj zu\u017cycie do odpowiedzi
openai-llm.usageFooter.help=Dodaje na ko\u0144cu ka\u017cdej ko\u0144cowej odpowiedzi lini\u0119 kursyw\u0105 z tokenami ostatniego zapytania - lub, gdy API podaje koszt ka\u017cdego zapytania jak OpenRouter, z kosztem ca\u0142ego pytania ze wszystkich jego zapyta\u0144. Morpheus nigdzie w czacie nie pokazuje zu\u017cycia. Tury z wywo\u0142aniami narz\u0119dzi pozostaj\u0105 bez zmian, a linia jest usuwana, zanim odpowied\u017a zostanie ponownie wys\u0142ana jako historia.
openai-llm.chatErrors.label=Pokazuj b\u0142\u0119dy API w czacie
openai-llm.chatErrors.help=Domy\u015blnie w\u0142\u0105czone. Gdy API odrzuci pytanie - z\u0142y klucz, brak \u015brodk\u00f3w, limit zapyta\u0144, niedost\u0119pny model - czat pokazuje komunikat API i co zrobi\u0107, zamiast og\u00f3lnego b\u0142\u0119du Morpheus. Komunikat nie jest przekazywany modelowi w historii rozmowy. Limit zapyta\u0144 lub przeci\u0105\u017cony dostawca jest wcze\u015bniej dwukrotnie przeczekiwany.
openai-llm.dropEmptyToolArguments.label=Usuwaj puste argumenty narz\u0119dzi
openai-llm.dropEmptyToolArguments.help=Domy\u015blnie w\u0142\u0105czone. Niekt\u00f3re modele wype\u0142niaj\u0105 ka\u017cdy opcjonalny parametr wywo\u0142ania narz\u0119dzia pustym ci\u0105giem, 0 lub false, a wbudowane narz\u0119dzia Morpheus traktuj\u0105 to jako filtry: list_servers nie znajduje wtedy \u017cadnych serwer\u00f3w. Przy w\u0142\u0105czonej opcji takie argumenty najwy\u017cszego poziomu s\u0105 usuwane, zanim Morpheus uruchomi narz\u0119dzie, co odpowiada ich pomini\u0119ciu. Odznacz, aby przekazywa\u0107 wywo\u0142ania narz\u0119dzi dok\u0142adnie tak, jak napisa\u0142 je model.
