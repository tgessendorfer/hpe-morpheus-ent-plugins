name: build msp-tenant-overview

on:
  push:
    branches: [ main ]
    paths:
      - 'finops/msp-tenant-overview/**'
      - '.github/workflows/build-msp-tenant-overview.yml'
  pull_request:
    paths:
      - 'finops/msp-tenant-overview/**'
      - '.github/workflows/build-msp-tenant-overview.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finops/msp-tenant-overview
    steps:
      - uses: actions/checkout@v7

      # Groovy 3.0.9 does not run on JDK 21, and the plugin API targets Java 11.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew clean test shadowJar --no-daemon

      - name: Publish test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msp-tenant-overview-test-results
          path: finops/msp-tenant-overview/build/reports/tests/test
          retention-days: 14

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: morpheus-msp-tenant-overview-plugin
          path: finops/msp-tenant-overview/build/libs/*-all.jar
          retention-days: 90
