name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Cancel any running jobs for this same ref/PR
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run CodeNarc code quality check
      run: ./gradlew codenarcMain --no-daemon --stacktrace
      continue-on-error: true

    - name: Upload CodeNarc reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codenarc-reports
        path: build/reports/codenarc/
        retention-days: 7
        if-no-files-found: ignore

    - name: Run build
      run: ./gradlew build --no-daemon --stacktrace

    - name: Trivy scan
      # Pinned by commit: the action's tags were force-pushed to malware in
      # March 2026 (GHSA-69fq-xp46-6x23). Its default Trivy binary is older
      # than the fix for GHSA-mcj4-mphf-j9ff, so the version is set too.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'rootfs'
        scan-ref: 'build/libs/'
        ignore-unfixed: true
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
