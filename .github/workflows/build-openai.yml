name: build openai

on:
  push:
    branches: [ main ]
    paths:
      - 'llm/openai/**'
      - '.github/workflows/build-openai.yml'
  pull_request:
    paths:
      - 'llm/openai/**'
      - '.github/workflows/build-openai.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm/openai
    steps:
      - uses: actions/checkout@v7

      # Groovy 3.0.9 does not run on JDK 21, and the plugin API targets Java 11.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew clean test shadowJar --no-daemon

      # Morpheus 9.0.1 and 9.0.2 run plugin API 1.4.1, which sends request bodies differently from the 1.4.2
      # the build compiles against. The HTTP client tests must pass on the runtime version too.
      - name: Test the HTTP client against plugin API 1.4.1
        run: ./gradlew test --tests '*ApiServiceSpec*' -PmorpheusPluginApiVersion=1.4.1 --no-daemon

      - name: Publish test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openai-test-results
          path: llm/openai/build/reports/tests/test
          retention-days: 14

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: morpheus-openai-plugin
          path: llm/openai/build/libs/*-all.jar
          retention-days: 90
