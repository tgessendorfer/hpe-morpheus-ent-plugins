name: build budget-burn

on:
  push:
    branches: [ main ]
    paths:
      - 'finops/budget-burn/**'
      - '.github/workflows/build-budget-burn.yml'
  pull_request:
    paths:
      - 'finops/budget-burn/**'
      - '.github/workflows/build-budget-burn.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finops/budget-burn
    steps:
      - uses: actions/checkout@v7

      # Groovy 3.0.9 does not run on JDK 21, and the plugin API targets Java 11.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew clean test shadowJar --no-daemon

      - name: Publish test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: budget-burn-test-results
          path: finops/budget-burn/build/reports/tests/test
          retention-days: 14

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: morpheus-budget-burn-plugin
          path: finops/budget-burn/build/libs/*-all.jar
          retention-days: 90
