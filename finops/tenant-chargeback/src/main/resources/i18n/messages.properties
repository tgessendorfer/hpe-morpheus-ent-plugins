tenant-chargeback-report.noGroup=Servers without a group
tenant-chargeback-report.footnote=Source: Morpheus invoices (instances, and servers without an instance). Cost = purchase cost, list price = price including the price-set markup, margin = list price - cost (rounded to cents). Amounts in different currencies are never added; totals are per currency. For CSV, export the report result.
tenant-chargeback-report.chargebackMonth.label=Month (YYYY-MM)
tenant-chargeback-report.chargebackMonth.help=For example 2026-09. Leave empty for the current month, which Morpheus projects to the end of the month.
tenant-chargeback-report.markupPercent.label=Additional Markup %
tenant-chargeback-report.markupPercent.help=Applied to the list price to get the invoice amount, for example a managed service fee. 0 invoices the list price.
tenant-chargeback-report.includeProvider.label=Include Master Tenant Resources
tenant-chargeback-report.includeProvider.help=Also list the resources of the master tenant itself. Off shows the subtenants only.
tenant-chargeback-report.error.month=Enter the month as YYYY-MM, with a month from 01 to 12.
tenant-chargeback-report.error.markup=Enter the additional markup as a number, for example 5 or 7.5.
