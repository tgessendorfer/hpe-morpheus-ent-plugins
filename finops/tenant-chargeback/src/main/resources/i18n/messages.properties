tenant-chargeback-report.currentMonth=current month, projected
tenant-chargeback-report.tenants=Tenants
tenant-chargeback-report.invoiceTotal=Invoice amount
tenant-chargeback-report.inclMarkup=incl. additional markup
tenant-chargeback-report.section.currency=Total per Currency
tenant-chargeback-report.section.tenant=Per Tenant
tenant-chargeback-report.section.group=Per Tenant and Group
tenant-chargeback-report.col.tenant=Tenant
tenant-chargeback-report.col.group=Group
tenant-chargeback-report.col.currency=Currency
