# Cost Threshold Approval plugin - German. Non-ASCII characters are written as \uXXXX escapes.
# Request texts are MessageFormat patterns: {0} = monthly price, {1} = threshold, both with ISO currency code.
cost-threshold-approval.title=Kostenschwellen-Freigabe

cost-threshold-approval.threshold.label=Kostenschwelle pro Monat
cost-threshold-approval.threshold.help=Anfragen bis zu diesem Monatspreis werden automatisch freigegeben. W\u00e4hrung: das Feld darunter, sonst die W\u00e4hrung der Anfrage.
cost-threshold-approval.currency.label=W\u00e4hrung der Kostenschwelle
cost-threshold-approval.currency.help=ISO-4217-Code wie EUR, USD oder CHF. Leer bedeutet die W\u00e4hrung der Anfrage. Anfragen in einer anderen W\u00e4hrung werden nie automatisch freigegeben.
cost-threshold-approval.policyThreshold.label=Kostenschwelle pro Monat
cost-threshold-approval.policyThreshold.help=\u00dcberschreibt die Schwelle der Integration f\u00fcr diese Policy.
cost-threshold-approval.policyCurrency.label=W\u00e4hrung der Kostenschwelle
cost-threshold-approval.policyCurrency.help=ISO-4217-Code. Leer bedeutet die W\u00e4hrung der Integration, sonst die der Anfrage.

cost-threshold-approval.request.approved=Automatisch freigegeben ({0} <= {1} pro Monat)
cost-threshold-approval.request.overThreshold=\u00dcber der Kostenschwelle von {1}/Monat (angefragt {0}). Bitte wenden Sie sich f\u00fcr eine Freigabe an Ihren Provider.
cost-threshold-approval.request.currencyMismatch=W\u00e4hrung weicht von der Kostenschwelle ab (angefragt {0}, Schwelle {1}/Monat). Bitte wenden Sie sich f\u00fcr eine Freigabe an Ihren Provider.
cost-threshold-approval.request.noPrice=Kein Monatspreis f\u00fcr diese Anfrage (Schwelle {1}/Monat). Bitte wenden Sie sich f\u00fcr eine Freigabe an Ihren Provider.

cost-threshold-approval.msg.approved=Automatisch freigegeben
cost-threshold-approval.msg.overThreshold=Abgelehnt: Kostenschwelle \u00fcberschritten
cost-threshold-approval.msg.currencyMismatch=Abgelehnt: W\u00e4hrung weicht von der Kostenschwelle ab
cost-threshold-approval.msg.noPrice=Abgelehnt: kein Monatspreis
