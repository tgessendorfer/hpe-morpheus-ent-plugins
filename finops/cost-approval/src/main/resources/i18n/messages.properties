# Cost Threshold Approval plugin - English (default). Keys start with the provider code.
# Request texts are MessageFormat patterns: {0} = monthly price, {1} = threshold, both with ISO currency code;
# {2} = request type; {3} = form label of a misconfigured field, {4} = its level (cost-threshold-approval.level.*).
cost-threshold-approval.title=Cost Threshold Approval

cost-threshold-approval.threshold.label=Monthly Cost Threshold
cost-threshold-approval.threshold.help=Requests with a monthly price up to this amount are approved automatically. Currency: the field below, else the currency of the request.
cost-threshold-approval.currency.label=Threshold Currency
cost-threshold-approval.currency.help=ISO 4217 code such as EUR, USD or CHF. Empty means the currency of the request. Requests in another currency are never approved automatically.
cost-threshold-approval.policyThreshold.label=Monthly Cost Threshold
cost-threshold-approval.policyThreshold.help=Overrides the threshold of the integration for this policy.
cost-threshold-approval.policyCurrency.label=Threshold Currency
cost-threshold-approval.policyCurrency.help=ISO 4217 code. Empty means the currency of the integration, else of the request.

cost-threshold-approval.request.approved=Approved automatically ({0} <= {1} per month)
cost-threshold-approval.request.overThreshold=Above cost threshold of {1}/month (requested {0}). Please contact your provider for approval.
cost-threshold-approval.request.currencyMismatch=Currency differs from the cost threshold (requested {0}, threshold {1}/month). Please contact your provider for approval.
cost-threshold-approval.request.noPrice=No monthly price for this request (threshold {1}/month). Please contact your provider for approval.

cost-threshold-approval.msg.approved=Approved automatically
cost-threshold-approval.msg.overThreshold=Rejected: above cost threshold
cost-threshold-approval.msg.currencyMismatch=Rejected: currency differs from the cost threshold
cost-threshold-approval.msg.noPrice=Rejected: no monthly price
cost-threshold-approval.request.notChecked=Approved automatically: the cost threshold applies to provisioning, app and reconfigure requests only ({2})
cost-threshold-approval.msg.notChecked=Approved automatically: no cost check for this request type
cost-threshold-approval.request.thresholdMisconfigured=Cost threshold misconfigured: the field "{3}" of the {4} has an invalid value. An administrator must correct it. Please contact your provider for approval.
cost-threshold-approval.msg.thresholdMisconfigured=Rejected: cost threshold misconfigured

cost-threshold-approval.level.policy=policy
cost-threshold-approval.level.callOptions=approval call options
cost-threshold-approval.level.integration=integration
